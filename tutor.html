<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Physics Tutor</title>
	<link rel="icon" type="image/png" href="images/dice.png">
	<link rel="stylesheet" href="css/style_sheet.css" />
	<link rel="stylesheet" href="css/session-styles.css" />
	<link rel="stylesheet" href="css/quiz-styles.css" />
	<link rel="stylesheet" href="css/chat-history.css" />

</head>

<body>
	<!-- Email Gate Overlay -->
	<div id="emailGate" style="
			position: fixed; inset: 0; z-index: 99999;
			background: linear-gradient(135deg, #881c1c 0%, #6e1616 100%);
			display: flex; align-items: center; justify-content: center;
		">
		<div style="
				background: white; border-radius: 16px; padding: 48px 40px;
				max-width: 420px; width: 90%; text-align: center;
				box-shadow: 0 20px 60px rgba(0,0,0,0.3);
			">
			<div style="font-size: 48px; margin-bottom: 16px;">🎓</div>
			<h2 style="color: #881c1c; margin: 0 0 8px; font-size: 1.6em;">Physics Tutor</h2>
			<p style="color: #666; margin: 0 0 28px; font-size: 0.95em;">Enter your UMass email to continue</p>
			<input id="emailGateInput" type="email" placeholder="yourname@umass.edu" style="
						width: 100%; padding: 14px 16px; font-size: 15px;
						border: 2px solid #e0e0e0; border-radius: 10px;
						outline: none; box-sizing: border-box; margin-bottom: 10px;
						transition: border-color 0.2s;
					" />
			<div id="emailGateError" style="color: #dc3545; font-size: 13px; margin-bottom: 12px; min-height: 18px;">
			</div>
			<button id="emailGateBtn" style="
						width: 100%; padding: 14px; font-size: 15px; font-weight: 600;
						background: linear-gradient(135deg, #881c1c, #6e1616);
						color: white; border: none; border-radius: 10px;
						cursor: pointer; transition: opacity 0.2s;
					">Continue</button>
		</div>
	</div>
	<script>
		(function () {
			const gate = document.getElementById('emailGate');
			const input = document.getElementById('emailGateInput');
			const btn = document.getElementById('emailGateBtn');
			const err = document.getElementById('emailGateError');
			input.addEventListener('focus', () => input.style.borderColor = '#881c1c');
			input.addEventListener('blur', () => input.style.borderColor = '#e0e0e0');
			async function submit() {
				const val = input.value.trim().toLowerCase();
				if (!val.endsWith('@umass.edu')) {
					err.textContent = 'Please enter a valid @umass.edu email address.';
					input.style.borderColor = '#dc3545';
					return;
				}
				btn.disabled = true;
				btn.textContent = 'Loading...';

				// Record login on Render backend
				try {
					const res = await fetch('https://ai-tutor-53f1.onrender.com/api/user-activity/login', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ email: val }),
					});
					if (res.ok) {
						const data = await res.json();
						window._activityId = data.activityId;
					}
				} catch (_) { /* non-critical */ }

				window.studentEmail = val;
				gate.style.opacity = '0';
				gate.style.transition = 'opacity 0.3s';
				setTimeout(() => {
					gate.remove();
					// Init chat history manager now that we have the email
					if (window.chatHistoryManager) {
						window.chatHistoryManager.init(val);
					}
				}, 300);
			}
			btn.addEventListener('click', submit);
			input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
		})();
	</script>

	<!-- ── Idle-timeout auto-logout ──────────────────────────────────────────
	     Counts down from the last chat message (not mouse movement).
	     14 min → warning banner with 60s countdown.
	     15 min → logout + reload.
	──────────────────────────────────────────────────────────────────────── -->
	<script>
		(function () {
			const IDLE_TIMEOUT_MS = 15 * 60 * 1000;   // 15 minutes
			const WARNING_BEFORE_MS = 1 * 60 * 1000;   // show warning 60 s before logout

			let _warningTimer = null;
			let _logoutTimer = null;
			let _countdownInterval = null;
			let _started = false;

			// ── Auto-logout ────────────────────────────────────────────────
			async function doAutoLogout() {
				clearAll();
				removeWarningBanner();

				if (window._activityId) {
					try {
						await fetch('https://ai-tutor-53f1.onrender.com/api/user-activity/logout', {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({ activityId: window._activityId }),
						});
					} catch (_) { }
				}
				window.location.reload();
			}

			// ── Warning banner ─────────────────────────────────────────────
			function showWarning() {
				removeWarningBanner();
				let secsLeft = Math.round(WARNING_BEFORE_MS / 1000);

				const banner = document.createElement('div');
				banner.id = 'idleWarningBanner';
				banner.style.cssText = `
					position: fixed; bottom: 0; left: 0; right: 0; z-index: 99998;
					background: #881c1c; color: #fff;
					display: flex; align-items: center; justify-content: center; gap: 16px;
					padding: 14px 20px; font-size: 14px; font-weight: 600;
					box-shadow: 0 -2px 12px rgba(0,0,0,0.3);
				`;

				const msg = document.createElement('span');
				msg.id = 'idleCountdownMsg';
				msg.textContent = `Signing you out in ${secsLeft}s due to inactivity…`;

				const stayBtn = document.createElement('button');
				stayBtn.textContent = 'Stay Signed In';
				stayBtn.style.cssText = `
					background: white; color: #881c1c; border: none;
					border-radius: 6px; padding: 7px 16px; font-size: 13px;
					font-weight: 700; cursor: pointer; flex-shrink: 0;
				`;
				stayBtn.addEventListener('click', () => {
					resetIdleTimer();
					removeWarningBanner();
				});

				banner.appendChild(msg);
				banner.appendChild(stayBtn);
				document.body.appendChild(banner);

				_countdownInterval = setInterval(() => {
					secsLeft--;
					const el = document.getElementById('idleCountdownMsg');
					if (el) el.textContent = `Signing you out in ${secsLeft}s due to inactivity…`;
					if (secsLeft <= 0) clearInterval(_countdownInterval);
				}, 1000);
			}

			function removeWarningBanner() {
				if (_countdownInterval) { clearInterval(_countdownInterval); _countdownInterval = null; }
				const b = document.getElementById('idleWarningBanner');
				if (b) b.remove();
			}

			// ── Timer management ───────────────────────────────────────────
			function clearAll() {
				if (_warningTimer) { clearTimeout(_warningTimer); _warningTimer = null; }
				if (_logoutTimer) { clearTimeout(_logoutTimer); _logoutTimer = null; }
			}

			function resetIdleTimer() {
				if (!_started) return; // don't start until logged in
				clearAll();
				removeWarningBanner();
				_warningTimer = setTimeout(showWarning, IDLE_TIMEOUT_MS - WARNING_BEFORE_MS);
				_logoutTimer = setTimeout(doAutoLogout, IDLE_TIMEOUT_MS);
			}

			// Expose globally so tutor-chat.js can reset on every message
			window.resetIdleChatTimer = resetIdleTimer;

			// ── Start once login is confirmed ──────────────────────────────
			// Poll until window._activityId or window.studentEmail is set
			const _startPoller = setInterval(() => {
				if (window._activityId || window.studentEmail) {
					clearInterval(_startPoller);
					_started = true;
					resetIdleTimer();
				}
			}, 500);
		})();
	</script>
	<div class="tutor-container">
		<div class="tutor-header">
			<div class="tutor-header-topbar" id="signOutBar">
				<span class="sob-email" id="sobEmail"></span>
				<div class="sob-actions">
					<button id="chatHistoryToggleBtn">📋 History</button>
					<button id="signOutBtn">Sign Out</button>
				</div>
			</div>
			<h1>Physics Tutor</h1>
			<p>Your friendly guide to physics!</p>
			<div class="mobile-nav" id="mobileNav">
				<button class="mobile-nav-btn active" id="chatNavBtn" onclick="showMobileSection('chat')">💬
					Chat</button>
				<button class="mobile-nav-btn" id="whiteboardNavBtn" onclick="showMobileSection('whiteboard')">📝
					Whiteboard</button>
			</div>
		</div>
		<div class="main-content">
			<div class="chat-section">
				<div class="chat-container">
					<div class="chat-messages" id="chatMessages"></div>
					<div class="chat-input-container">
						<input type="file" id="fileInput"
							accept=".pdf,.png,.jpg,.jpeg,.webp,.heic,.heif,.mp4,.mov,.avi,.wav,.mp3,.txt,.html,.css,.js,.py"
							multiple style="display: none;">
						<input type="text" id="chatInput" placeholder="Ask me anything about physics!" />
						<button id="uploadButton" class="upload-btn" title="Upload Files">📎</button>
						<button id="voiceInputBtn" class="upload-btn" title="Click to speak">🎤</button>
						<button id="sendButton">Send</button>
					</div>
					<div id="filePreview" class="file-preview"></div>
				</div>
			</div>
			<div class="whiteboard-section" id="whiteboardSection">
				<div class="whiteboard-tabs">
					<button class="tab-button active" id="notesTab">📝 Notes</button>
				</div>
				<div class="whiteboard-container">
					<div class="whiteboard-panel active" id="notesPanel">
						<div class="whiteboard-header">
							<h3>Student Notes</h3>
							<div class="whiteboard-controls">
								<button class="mode-btn active" id="writeModeBtn">Write</button>
								<button class="mode-btn" id="drawModeBtn">Draw</button>
								<button id="clearNotesButton">Clear</button>
								<button id="saveNotesButton">Save</button>
								<button id="expandNotesButton">Expand</button>
							</div>
						</div>
						<div class="notebook-container">
							<div class="notebook-paper">
								<textarea id="studentNotes"
									placeholder="Take your notes here... You can switch to draw mode to sketch diagrams and formulas!"></textarea>
								<canvas id="notesCanvas" class="notes-canvas"></canvas>
							</div>
						</div>
						<div class="notes-toolbar">
							<div class="pen-size-group">
								<label for="penSize">Pen Size:</label>
								<input type="range" id="penSize" min="1" max="20" value="2">
								<span class="pen-size-display" id="penSizeDisplay">2</span>
							</div>
							<div class="pen-color-group">
								<label for="penColor">Color:</label>
								<input type="color" id="penColor" value="#333333">
							</div>
							<button id="eraserNotesButton" class="eraser-btn">
								🧽 <span>Eraser</span>
							</button>
						</div>
					</div>
				</div>
			</div>
			<!-- Book Reference Modal -->
			<div id="bookRefOverlay" style="display:none;" onclick="if(event.target===this)closeBookRef()">
				<div id="bookRefPanel">
					<div id="bookRefHeader">
						<span id="bookRefTitle">📖 College Physics 2e</span>
						<div id="bookRefNav">
							<button onclick="bookRefChangePage(-1)">&#8249;</button>
							<span id="bookRefPageLabel"></span>
							<button onclick="bookRefChangePage(1)">&#8250;</button>
						</div>
						<button id="bookRefClose" onclick="closeBookRef()">✕</button>
					</div>
					<iframe id="bookRefIframe" style="width:100%;flex:1;border:none;"></iframe>
				</div>
			</div>
		</div>
		<div class="loading-indicator" id="loadingIndicator" style="display: none">
			<div class="loading-content">
				<div class="spinner"></div>
				<div class="loading-text">
					<span id="loadingMessage">Tutor is thinking...</span>
					<span id="loadingTime">Estimated time: 3-5 seconds</span>
				</div>
			</div>
			<div class="progress-bar">
				<div class="progress-fill" id="progressFill"></div>
			</div>
		</div>
	</div>

	<div class="privacy-notice">
		<p>We do not collect, store, or sell any personal data. This website is for educational use only.</p>
	</div>

	<script src="javascript/diagram-renderer.js"></script>

		<script src="javascript/tutor-whiteboard.js"></script>
		-->
	<script src="javascript/student-notes.js"></script>
	<script src="javascript/session-manager.js"></script>
	<script src="javascript/quiz-system.js"></script>

</body>
